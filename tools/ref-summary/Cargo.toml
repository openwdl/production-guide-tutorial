[package]
name = "ref-summary"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Summarize nucleotide FASTA files for the OpenWDL production course"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
clap = { version = "4.5.47", features = ["derive"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
tempfile = "3.21.0"

[dev-dependencies]
assert_cmd = "2.0.17"
predicates = "3.1.3"
